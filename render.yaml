services:
  - type: web
    name: ustream
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: RAPID_API_BASE
        value: https://moviebox-api.p.rapidapi.com
      - key: RAPID_API_HOST
        value: moviebox-api.p.rapidapi.com
      - key: RAPID_API_KEY
        sync: false
